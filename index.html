<!doctype html>
<html lang="en">
  <head>
    <meta name="robots" content="noindex,nofollow" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#222629" />
    <meta name="description" content="NEXUS — Explore. Connect. Order. The customer research portal by Science By Hugs." />
    <link rel="icon" href="/brand/nexus-app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/nexus-touch-icon.png" />
    <title>NEXUS 2.0 — Internal Staging</title>
    <style>
      html,body{margin:0;min-height:100%;background:#222629;color:#F0F1EF;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #bootFallback{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
      #bootFallback>div{max-width:360px;padding:24px;border:1px solid #A8B0B2;border-radius:20px;background:#303639}
      #bootFallback strong{display:block;font-size:1.1rem;margin-bottom:8px}
      #bootFallback p{margin:0 0 16px;color:#A8B0B2;line-height:1.5;font-size:.85rem}
      #bootFallback button{min-height:44px;padding:0 16px;border:1px solid #A8B0B2;border-radius:12px;background:#303639;color:#F0F1EF;font-weight:800}
    </style>
  </head>
  <body>
    <div id="app">
      <div id="bootFallback">
        <div>
          <strong>Opening Nexus…</strong>
          <p>If Nexus does not load, refresh once. The app will recover automatically after the latest deployment finishes propagating.</p>
          <button type="button" onclick="location.reload()">Reload Nexus</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
